plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.3' apply false
}
allprojects {
    group = 'dev.prototype'
    version = '0.1.0'
    repositories { mavenCentral() }
}
subprojects {
    tasks.withType(JavaCompile).configureEach { options.release = 25 }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
}
