plugins { id 'net.fabricmc.fabric-loom' }
base { archivesName = 'prototype-integration-tests' }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    implementation project(':core')
    implementation project(':demo-addon')
}
loom {
    runs {
        gameTest {
            server()
            name 'Prototype server game tests'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile}"
            runDir 'build/gametest-run'
        }
    }
}
